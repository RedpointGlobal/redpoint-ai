# RedpointAI — rep double-click bundle (PREBUILT images, NO build, NO registry).
# Images are loaded from rp-ai-images.tar by start_redpoint-ai.bat; env comes from
# the single ./.env in this folder. Do not run this from the source repo — use the
# dev docker-compose.yml there. Reps: just double-click start_redpoint-ai.bat.
#
# ENV MODEL (single source of truth, no drift): each service loads the FULL ./.env
# superset verbatim via `env_file`, then `environment:` applies ONLY the container
# VALUE-OVERRIDES — the handful of values that must differ inside the compose
# network (reach peers by service NAME not localhost, container ports/paths). No
# key is defined here that isn't in .env, and nothing diverges from the web app's
# config except these documented overrides. In particular AUTH_REQUIRED is NOT set
# here: it comes from .env (auth=true), exactly like the web app — a past bug baked
# AUTH_REQUIRED=false here and silently diverged the container from the app.
services:
  server:
    image: rp-ai-server:__VERSION__
    pull_policy: never
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # --- container value-overrides only (keys all exist in .env) ---
      - PORT=3000
      - SEED_RPI_MCP_URL=http://mcp-rpi:3002/mcp # reach mcp by service name, not localhost
      - DRH_MCP_URL=http://mcp-drh:3003/mcp # reach mcp by service name, not localhost
      - DB_FILE_NAME=/app/data/redpoint-ai.db # SQLite path on the named volume below
      - INSTRUMENTATION_SINK_PATH=/app/instrumentation/instrumentation-events.jsonl # host bind-mount path
    volumes:
      # Named volume only (SQLite persistence). NO ./skills bind-mount — the
      # skills are baked into the image; a bind-mount would blank them out.
      - server-data:/app/data
      # Instrumentation output — host bind-mount so the JSONL lands next to the
      # .bat launchers, retrievable and surviving container recreation.
      - ./instrumentation:/app/instrumentation
    healthcheck:
      test: ["CMD", "bun", "--eval", "fetch('http://localhost:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  web:
    image: rp-ai-web:__VERSION__
    pull_policy: never
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      # --- container value-overrides only (keys all exist in .env) ---
      - NEXT_PUBLIC_API_URL=http://server:3000 # server by service name; the web's proxy routes call this
      - AUTH_TRUST_HOST=true # NextAuth: trust the proxied Host so the callback URL derives from the rep's browser origin
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  mcp-rpi:
    image: rp-ai-mcp-rpi:__VERSION__
    pull_policy: never
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      # --- container value-overrides only (keys all exist in .env) ---
      - RPI_MCP_HTTP_PORT=3002 # container port
    # No healthcheck: the slim runtime (debian:12-slim + compiled binary only) has
    # no bun/curl/wget to probe /health, and nothing depends_on this service being
    # healthy. Container liveness is real regardless — a crashed process exits it.

  mcp-drh:
    image: rp-ai-mcp-drh:__VERSION__
    pull_policy: never
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file: .env
    environment:
      # --- container value-overrides only (keys all exist in .env) ---
      - DRH_MCP_HTTP_PORT=3003 # container port
    # No healthcheck: see mcp-rpi above — slim runtime has no probe tool and nothing
    # depends_on this being healthy; a crashed process still exits the container.

volumes:
  server-data:
